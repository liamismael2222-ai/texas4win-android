plugins {
    id 'com.android.application'
}

android {
    namespace 'com.texas4win.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.texas4win.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        // تفعيل Multidex للتطبيقات الكبيرة
        multiDexEnabled true

        // دعم RTL للغة العربية
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        // Release Build - للنشر على Google Play
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            
            // تفعيل التوقيع للإنتاج
            // signingConfig signingConfigs.release
        }
        
        // Debug Build - للاختبار
        debug {
            applicationIdSuffix ".debug"
            debuggable true
            minifyEnabled false
        }
    }

    // إعدادات الترجمة
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // خيارات الحزم
    packagingOptions {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt'
            ]
        }
    }

    // اختبارات الأمان
    lint {
        // تفعيل فحوصات الأمان
        enable 'MissingTranslation', 'ExtraTranslation', 'HardcodedText'
        abortOnError false
        // تجاهل المشاكل البسيطة
        disable 'MissingDimensionResource'
    }
}

dependencies {
    // AndroidX الأساسي - آخر إصدار آمن
    implementation 'androidx.appcompat:appcompat:1.6.1'
    
    // مكتبة Multidex
    implementation 'androidx.multidex:multidex:2.0.1'
    
    // SwipeRefreshLayout لسحب التحديث
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    
    // Material Design
    implementation 'com.google.android.material:material:1.11.0'
    
    // Lifecycle (آمن ومستقر)
    implementation 'androidx.lifecycle:lifecycle-runtime:2.6.2'
}