<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1"/>
<meta name="theme-color" content="#1a1a1a"/>
<title>Number1 Bot — لوحة التحكم</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Cairo:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a1a;font-family:'Cairo',sans-serif;direction:rtl;overflow-x:hidden}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:#2a2a2a}
::-webkit-scrollbar-thumb{background:#FFD70066;border-radius:3px}
input,button,textarea,select{font-family:'Cairo',sans-serif}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,215,0,0.4)}70%{box-shadow:0 0 0 10px rgba(255,215,0,0)}}
@keyframes fireGlow{0%,100%{text-shadow:0 0 10px #FF4500,0 0 20px #FF6347}50%{text-shadow:0 0 20px #FF4500,0 0 30px #FF6347}}
@keyframes float{0%,100%{transform:translateY(0px)}50%{transform:translateY(-10px)}}
.fade-in{animation:fadeIn 0.5s ease forwards}
.btn-premium:hover{transform:scale(1.05);box-shadow:0 8px 24px rgba(255,215,0,.5)}
.bot-icon{animation:float 3s ease-in-out infinite}
.fire-text{animation:fireGlow 2s ease-in-out infinite}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;alignItems:center;justifyContent:center;zIndex:1000;backdropFilter:blur(8px)}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const C = {
  bg:"#1a1a1a", card:"#2a2a2a", border:"#3a3a3a",
  gold:"#FFD700", goldL:"#FFF44F", goldD:"#DAA520",
  fire:"#FF4500", fireLight:"#FF6347", fireGlow:"#FFB347",
  white:"#FFFFFF", text:"#e8eaf0", muted:"#888888"
};

/* ── Particles Background ── */
function Particles() {
  const ref = useRef();
  useEffect(() => {
    const cv = ref.current, ctx = cv.getContext("2d");
    if (!cv) return;
    let raf;
    const resize = () => { cv.width = window.innerWidth; cv.height = window.innerHeight; };
    resize(); window.addEventListener("resize", resize);
    const pts = Array.from({length:80}, () => ({
      x: Math.random()*cv.width, y: Math.random()*cv.height,
      r: Math.random()*1.2+0.4,
      vx: (Math.random()-.5)*.4, vy: (Math.random()-.5)*.4,
      a: Math.random()*.6+.2
    }));
    const draw = () => {
      ctx.clearRect(0,0,cv.width,cv.height);
      pts.forEach(p => {
        p.x+=p.vx; p.y+=p.vy;
        if(p.x<0)p.x=cv.width; if(p.x>cv.width)p.x=0;
        if(p.y<0)p.y=cv.height; if(p.y>cv.height)p.y=0;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fillStyle=`rgba(255,215,0,${p.a})`; ctx.fill();
      });
      raf=requestAnimationFrame(draw);
    };
    draw();
    return () => { cancelAnimationFrame(raf); window.removeEventListener("resize",resize); };
  }, []);
  return <canvas ref={ref} style={{position:"fixed",inset:0,zIndex:0,pointerEvents:"none"}}/>
}

/* ── Premium Button ── */
function PremiumButton({icon, label, color, onClick}) {
  return (
    <button 
      onClick={onClick}
      className="btn-premium"
      style={{
        display:"flex",
        flexDirection:"column",
        alignItems:"center",
        justifyContent:"center",
        gap:8,
        padding:"18px 16px",
        borderRadius:16,
        border:`2px solid ${color}`,
        background:`linear-gradient(135deg,${color}22,${color}11)`,
        color:color,
        fontWeight:700,
        fontSize:12,
        cursor:"pointer",
        minWidth:100,
        boxShadow:`0 4px 15px ${color}44`,
        transition:"all 0.3s ease"
      }}>
      <span style={{fontSize:24}}>{icon}</span>
      <span>{label}</span>
    </button>
  );
}

/* ── Login ── */
function Login({onLogin}){
  const [u,setU]=useState(""), [p,setP]=useState(""), [loading,setL]=useState(false), [err,setE]=useState("");
  const go = () => {
    if(!u||!p){setE("يرجى إدخال بيانات الدخول");return;}
    setL(true); setE("");
    setTimeout(()=>{ setL(false); onLogin({name:u,role:"مشغل البوت",id:"BOT-00001",isAdmin:u==="admin"}); },1400);
  };
  return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:C.bg,position:"relative"}}>
      <Particles/>
      <div className="fade-in" style={{position:"relative",zIndex:1,width:"100%",maxWidth:450,margin:"0 16px",
        background:`linear-gradient(160deg,#2a2a2a,#1f1f1f)`,border:`2px solid ${C.gold}44`,borderRadius:24,
        padding:"50px 42px",boxShadow:`0 0 80px rgba(255,215,0,.2),0 40px 100px rgba(0,0,0,.8)`}}>
        <div style={{textAlign:"center",marginBottom:40}}>
          <div style={{display:"inline-flex",alignItems:"center",justifyContent:"center",width:90,height:90,
            borderRadius:20,background:`linear-gradient(135deg,${C.gold},${C.goldD})`,fontSize:50,marginBottom:20,
            boxShadow:`0 12px 40px rgba(255,215,0,.6)`,animation:"pulse 2s infinite",className:"bot-icon"}}>🤖</div>
          <div className="fire-text" style={{fontSize:32,fontWeight:900,color:C.fireLight,fontFamily:"'Playfair Display',serif",letterSpacing:2}}>NUMBER1 BOT</div>
          <div style={{color:C.muted,fontSize:13,marginTop:8}}>لوحة التحكم المتقدمة</div>
        </div>
        {[{l:"اسم المستخدم",v:u,s:setU,t:"text",ph:"أدخل اسم المستخدم"},
          {l:"كلمة المرور",v:p,s:setP,t:"password",ph:"••••••••"}].map(({l,v,s,t,ph})=>(
          <div key={l} style={{marginBottom:20}}>
            <label style={{display:"block",fontSize:13,color:C.muted,marginBottom:9,fontWeight:700}}>{l}</label>
            <input type={t} value={v} placeholder={ph}
              onChange={e=>s(e.target.value)} onKeyDown={e=>e.key==="Enter"&&go()}
              style={{width:"100%",padding:"14px 18px",background:"#1a1a1a",border:`2px solid ${C.border}`,
                borderRadius:12,color:C.text,fontSize:15,outline:"none",boxSizing:"border-box",
                fontFamily:"'Cairo',sans-serif",transition:"all 0.3s"}}
              onFocus={e=>{e.target.style.borderColor=C.gold; e.target.style.boxShadow=`0 0 20px ${C.gold}44`}}
              onBlur={e=>{e.target.style.borderColor=C.border; e.target.style.boxShadow="none"}}/>
          </div>
        ))}
        {err&&<div style={{color:C.fireLight,fontSize:13,marginBottom:14,textAlign:"center",fontWeight:600}}>{err}</div>}
        <button onClick={go} disabled={loading} style={{width:"100%",padding:15,marginTop:10,
          background:loading?"#333":`linear-gradient(135deg,${C.fire},${C.fireLight})`,border:"none",borderRadius:12,
          color:"#fff",fontWeight:900,fontSize:16,cursor:loading?"not-allowed":"pointer",
          boxShadow:loading?"none":`0 10px 30px rgba(255,69,0,.5)`,transition:"all .3s"}}>
          {loading?"جاري الدخول...":"دخول الآن"}
        </button>
      </div>
    </div>
  );
}

/* ── Main Dashboard ── */
function Dashboard({user,onLogout}){
  const defaultButtons = [
    {label:"الدعم",icon:"💬",color:C.gold,url:"https://t.me/number1texaschannel"},
    {label:"البوت",icon:"🤖",color:C.fireLight,url:"https://t.me/Number1Texas_Bot"},
    {label:"التيليجرام",icon:"✈️",color:C.fireGlow,url:"https://t.me/number1texaschannel"},
    {label:"الفيسبوك",icon:"👍",color:"#1877f2",url:"https://www.facebook.com/share/p/1bCAbK1DxL/"},
    {label:"الكاشير",icon:"💰",color:C.gold,url:"https://m.texas4win.com/cashier"},
    {label:"الموقع الرسمي",icon:"🌐",color:C.fireGlow,url:"https://m.texas4win.com/"},
  ];

  return (
    <div style={{minHeight:"100vh",background:C.bg,display:"flex",flexDirection:"column"}}>
      {/* NAV */}
      <nav style={{background:"rgba(42,42,42,.95)",borderBottom:`2px solid ${C.gold}44`,padding:"0 24px",
        display:"flex",alignItems:"center",justifyContent:"space-between",height:70,
        backdropFilter:"blur(20px)",position:"sticky",top:0,zIndex:100,boxShadow:"0 4px 30px rgba(255,69,0,.2)"}}>
        <div style={{display:"flex",alignItems:"center",gap:14}}>
          <div className="bot-icon" style={{width:50,height:50,borderRadius:14,background:`linear-gradient(135deg,${C.gold},${C.goldD})`,
            display:"flex",alignItems:"center",justifyContent:"center",fontSize:28,boxShadow:`0 8px 25px rgba(255,215,0,.5)`,fontWeight:"900"}}>🤖</div>
          <div>
            <div className="fire-text" style={{fontFamily:"'Playfair Display',serif",color:C.fireLight,fontSize:18,fontWeight:900,letterSpacing:1}}>NUMBER1 BOT</div>
            <div style={{color:C.muted,fontSize:10}}>لوحة التحكم المتقدمة</div>
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <div style={{display:"flex",alignItems:"center",gap:10,background:C.card,
            border:`2px solid ${C.gold}44`,borderRadius:12,padding:"8px 14px"}}>
            <div style={{width:36,height:36,borderRadius:"50%",
              background:`linear-gradient(135deg,${C.fire},${C.fireLight})`,
              display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,color:"#fff",fontWeight:900}}>
              {user.name[0]?.toUpperCase()}
            </div>
            <div style={{fontSize:12}}>
              <div style={{color:C.text,fontWeight:700}}>{user.name}</div>
              <div style={{color:C.gold,fontSize:10}}>{user.isAdmin?"مسؤول":"مشغل"}</div>
            </div>
          </div>
          <button onClick={onLogout} style={{padding:"8px 14px",background:C.fire,border:"none",borderRadius:10,
            color:"#fff",fontWeight:700,fontSize:12,cursor:"pointer"}}>تسجيل خروج</button>
        </div>
      </nav>

      {/* CONTENT */}
      <div style={{flex:1,padding:28}}>
        <div className="fade-in">
          <h1 style={{color:C.fireLight,marginBottom:10,fontSize:28,fontWeight:900,textAlign:"center"}}>مرحباً بك في لوحة التحكم</h1>
          <p style={{color:C.muted,marginBottom:32,textAlign:"center",fontSize:14}}>الوصول المباشر لجميع الخدمات والأدوات</p>
          
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(130px,1fr))",gap:20,maxWidth:1000,margin:"0 auto"}}>
            {defaultButtons.map((btn,idx)=>(
              <PremiumButton 
                key={idx}
                icon={btn.icon}
                label={btn.label}
                color={btn.color}
                onClick={()=>window.open(btn.url,"_blank")}
              />
            ))}
          </div>

          {/* Info Section */}
          <div style={{marginTop:40,padding:24,background:C.card,border:`2px solid ${C.gold}33`,borderRadius:16}}>
            <h2 style={{color:C.fireLight,marginBottom:16,fontSize:18,fontWeight:700}}>ℹ️ معلومات التطبيق</h2>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))",gap:16}}>
              <div style={{background:"#1a1a1a",padding:14,borderRadius:10,borderLeft:`3px solid ${C.gold}`}}>
                <div style={{color:C.muted,fontSize:11}}>اسم التطبيق</div>
                <div style={{color:C.fireLight,fontSize:14,fontWeight:700,marginTop:4}}>NUMBER1 BOT</div>
              </div>
              <div style={{background:"#1a1a1a",padding:14,borderRadius:10,borderLeft:`3px solid ${C.fire}`}}>
                <div style={{color:C.muted,fontSize:11}}>معرف المستخدم</div>
                <div style={{color:C.text,fontSize:14,fontWeight:700,marginTop:4}}>{user.id}</div>
              </div>
              <div style={{background:"#1a1a1a",padding:14,borderRadius:10,borderLeft:`3px solid ${C.gold}`}}>
                <div style={{color:C.muted,fontSize:11}}>النسخة</div>
                <div style={{color:C.text,fontSize:14,fontWeight:700,marginTop:4}}>v1.0.0</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      {/* FOOTER */}
      <div style={{background:C.card,borderTop:`2px solid ${C.gold}44`,padding:"16px 24px",
        display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div style={{color:C.muted,fontSize:11}}>© 2026 Number1 Bot • جميع الحقوق محفوظة</div>
        <div style={{color:C.muted,fontSize:11}}>🔐 آمن ومحمي</div>
      </div>
    </div>
  );
}

/* ── Main App ── */
export default function App(){
  const [user,setUser]=useState(null);
  return user ? <Dashboard user={user} onLogout={()=>setUser(null)}/> : <Login onLogin={setUser}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
