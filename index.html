<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#060810;font-family:'Cairo',sans-serif;direction:rtl;overflow-x:hidden}
::-webkit-scrollbar{width:6px}

input,button{font-family:'Cairo',sans-serif}

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const C = {
  bg:"#060810", card:"#0d1120", border:"#1a2240",
  gold:"#c9a84c", goldL:"#f0cc76", goldD:"#8a6a1e",
  green:"#00e5a0", red:"#ff4d6d", blue:"#3d6fff",
  text:"#e8eaf0", muted:"#5a6480"
};

/* ── Particles ── */
function Particles() {
  const ref = useRef();
  useEffect(() => {
    const cv = ref.current, ctx = cv.getContext("2d");
    let raf;
    const resize = () => { cv.width = window.innerWidth; cv.height = window.innerHeight; };
    resize(); window.addEventListener("resize", resize);
    const pts = Array.from({length:70}, () => ({
      x: Math.random()*cv.width, y: Math.random()*cv.height,
      r: Math.random()*1.4+0.3,
      vx: (Math.random()-.5)*.3, vy: (Math.random()-.5)*.3,
      a: Math.random()*.5+.1
    }));
    const draw = () => {
      ctx.clearRect(0,0,cv.width,cv.height);
      pts.forEach(p => {
        p.x+=p.vx; p.y+=p.vy;
        if(p.x<0)p.x=cv.width; if(p.x>cv.width)p.x=0;
        if(p.y<0)p.y=cv.height; if(p.y>cv.height)p.y=0;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fillStyle=`rgba(201,168,76,${p.a})`; ctx.fill();
      });
      for(let i=0;i<pts.length;i++) for(let j=i+1;j<pts.length;j++){
        const dx=pts[i].x-pts[j].x, dy=pts[i].y-pts[j].y, d=Math.sqrt(dx*dx+dy*dy);
        if(d<110){ ctx.beginPath(); ctx.moveTo(pts[i].x,pts[i].y); ctx.lineTo(pts[j].x,pts[j].y);
          ctx.strokeStyle=`rgba(201,168,76,${.07*(1-d/110)})`; ctx.lineWidth=.5; ctx.stroke(); }
      }
      raf=requestAnimationFrame(draw);
    };
    draw();
    return () => { cancelAnimationFrame(raf); window.removeEventListener("resize",resize); };
  }, []);
  return <canvas ref={ref} style={{position:"fixed",inset:0,zIndex:0,pointerEvents:"none"}}/>;
}

/* ── Stat Card ── */
function Stat({label,val,sub,icon,accent,trend}){
  return (
    <div style={{background:"linear-gradient(135deg,#0d1120,#111828)",border:`1px solid ${(accent||C.border)}22`,
      borderRadius:16,padding:"22px 24px",position:"relative",overflow:"hidden",
      boxShadow:"0 4px 30px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.04)"}}>
      <div style={{position:"absolute",top:-20,right:-20,width:80,height:80,borderRadius:"50%",
        background:`${accent||C.gold}18`,filter:"blur(20px)"}}/>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}}>
        <span style={{color:C.muted,fontSize:11,fontFamily:"'Space Mono',monospace",letterSpacing:2,textTransform:"uppercase"}}>{label}</span>
        <span style={{fontSize:22}}>{icon}</span>
      </div>
      <div style={{fontSize:26,fontWeight:700,color:C.text,fontFamily:"'Playfair Display',serif",letterSpacing:-1}}>{val}</div>
      {sub&&<div style={{marginTop:8,fontSize:12,color:trend==="up"?C.green:trend==="down"?C.red:C.muted}}>{sub}</div>}
    </div>
  );
}

/* ── Bar Chart ── */
function Chart({data,color}){
  const mx=Math.max(...data);
  return (
    <div style={{display:"flex",alignItems:"flex-end",gap:4,height:60}}>
      {data.map((v,i)=>(
        <div key={i} style={{flex:1,height:`${(v/mx)*100}%`,
          background:`linear-gradient(to top,${color}bb,${color}22)`,
          borderRadius:"3px 3px 0 0",minHeight:4}}/>
      ))}
    </div>
  );
}

/* ── Login ── */
function Login({onLogin}){
  const [u,setU]=useState(""), [p,setP]=useState(""), [loading,setL]=useState(false), [err,setE]=useState("");
  const go = () => {
    if(!u||!p){setE("يرجى إدخال اسم المستخدم وكلمة المرور");return;}
    setL(true); setE("");
    setTimeout(()=>{ setL(false); onLogin({name:u,role:"وكيل ذهبي",id:"AG-00742"}); },1400);
  };
  return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:C.bg,position:"relative"}}>
      <Particles/>
      <div className="fade-in" style={{position:"relative",zIndex:1,width:"100%",maxWidth:420,margin:"0 16px",
        background:"linear-gradient(160deg,#0d1120,#111828)",border:`1px solid ${C.gold}33`,borderRadius:24,
        padding:"48px 40px",boxShadow:`0 0 60px rgba(201,168,76,.08),0 30px 80px rgba(0,0,0,.6)`}}>
        <div style={{textAlign:"center",marginBottom:36}}>
          <div style={{display:"inline-flex",alignItems:"center",justifyContent:"center",width:72,height:72,
            borderRadius:20,background:`linear-gradient(135deg,${C.gold},${C.goldD})`,fontSize:32,marginBottom:16,
            boxShadow:`0 8px 32px rgba(201,168,76,.4)`,animation:"pulse 2s infinite"}}>♠</div>
          <div style={{fontSize:26,fontWeight:800,color:C.goldL,fontFamily:"'Playfair Display',serif"}}>Texas4Win</div>
          <div style={{color:C.muted,fontSize:13,marginTop:4}}>منصة إدارة الوكلاء</div>
        </div>
        {[{l:"اسم المستخدم",v:u,s:setU,t:"text",ph:"أدخل اسم المستخدم"},
          {l:"كلمة المرور",v:p,s:setP,t:"password",ph:"••••••••"}].map(({l,v,s,t,ph})=>(
          <div key={l} style={{marginBottom:18}}>
            <label style={{display:"block",fontSize:13,color:C.muted,marginBottom:8,fontWeight:600}}>{l}</label>
            <input type={t} value={v} placeholder={ph}
              onChange={e=>s(e.target.value)} onKeyDown={e=>e.key==="Enter"&&go()}
              style={{width:"100%",padding:"13px 16px",background:"#060810",border:`1px solid ${C.border}`,
                borderRadius:12,color:C.text,fontSize:15,outline:"none",boxSizing:"border-box",
                fontFamily:"'Cairo',sans-serif"}}
              onFocus={e=>e.target.style.borderColor=C.gold}
              onBlur={e=>e.target.style.borderColor=C.border}/>
          </div>
        ))}
        {err&&<div style={{color:C.red,fontSize:13,marginBottom:12,textAlign:"center"}}>{err}</div>}
        <button onClick={go} disabled={loading} style={{width:"100%",padding:14,marginTop:8,
          background:loading?"#333":`linear-gradient(135deg,${C.gold},${C.goldD})`,border:"none",borderRadius:12,
          color:"#000",fontWeight:800,fontSize:16,cursor:loading?"not-allowed":"pointer",
          boxShadow:loading?"none":`0 8px 24px rgba(201,168,76,.35)`,transition:"all .3s"}}>
          {loading?"جاري الدخول...":"دخول إلى لوحة التحكم"}
        </button>
        <div style={{textAlign:"center",marginTop:20,color:C.muted,fontSize:12}}>
          هل نسيت كلمة المرور؟ <span style={{color:C.gold,cursor:"pointer"}}>استعادة الحساب</span>
        </div>
      </div>
    </div>
  );
}

      <div style={{background:C.card,borderTop:`1px solid ${C.border}`,padding:"12px 24px",

}

/* ── App Root ── */
function App(){
  const [loggedIn,setLoggedIn]=useState(false);
  const [userData,setUserData]=useState(null);
  const [installPrompt,setInstallPrompt]=useState(null);

  useEffect(()=>{
    const handler=e=>{ e.preventDefault(); setInstallPrompt(e); };
    window.addEventListener("beforeinstallprompt",handler);
    return ()=>window.removeEventListener("beforeinstallprompt",handler);
  },[]);

  const handleInstall=async()=>{
    if(!installPrompt)return;
    installPrompt.prompt();
    const r=await installPrompt.userChoice;
    if(r.outcome==="accepted")setInstallPrompt(null);
  };

  if(!loggedIn) return <Login onLogin={u=>{setUserData(u);setLoggedIn(true);}}/>;
  return <Dashboard user={userData} onLogout={()=>{setLoggedIn(false);setUserData(null);}}
    installPrompt={installPrompt} onInstall={handleInstall}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
