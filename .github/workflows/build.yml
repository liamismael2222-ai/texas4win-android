name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Create project structure
        run: |
          mkdir -p app/src/main/java/com/texas4win/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          cp MainActivity.java app/src/main/java/com/texas4win/app/
          mv AndroidManifest.xml app/src/main/ 2>/dev/null || true
          mv activity_main.xml app/src/main/res/layout/ 2>/dev/null || true
          mv strings.xml app/src/main/res/values/ 2>/dev/null || true
          mv themes.xml app/src/main/res/values/ 2>/dev/null || true
          mv colors.xml app/src/main/res/values/ 2>/dev/null || true
          mv splash_background.xml app/src/main/res/drawable/ 2>/dev/null || true
          mv ic_launcher_foreground.xml app/src/main/res/drawable/ 2>/dev/null || true
          cp ic_launcher.xml app/src/main/res/mipmap-hdpi/ 2>/dev/null || true
          cp ic_launcher.xml app/src/main/res/mipmap-mdpi/ 2>/dev/null || true
          cp ic_launcher.xml app/src/main/res/mipmap-xhdpi/ 2>/dev/null || true
          cp ic_launcher.xml app/src/main/res/mipmap-xxhdpi/ 2>/dev/null || true
          cp ic_launcher.xml app/src/main/res/mipmap-xxxhdpi/ 2>/dev/null || true
          sed -i 's|file:///android_asset/index.html|https://agents.texas4win.com/|g' app/src/main/java/com/texas4win/app/MainActivity.java
      - name: Write root build.gradle
        run: printf 'plugins {\n    id "com.android.application" version "8.2.0" apply false\n}\n' > build.gradle
      - name: Write app build.gradle
        run: |
          printf 'plugins {\n    id "com.android.application"\n}\nandroid {\n    namespace "com.texas4win.app"\n    compileSdk 34\n    defaultConfig {\n        applicationId "com.texas4win.app"\n        minSdk 26\n        targetSdk 34\n        versionCode 1\n        versionName "1.0"\n    }\n    buildTypes {\n        debug { debuggable true }\n    }\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_1_8\n        targetCompatibility JavaVersion.VERSION_1_8\n    }\n}\ndependencies {\n    implementation "androidx.appcompat:appcompat:1.6.1"\n    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"\n    implementation "com.google.android.material:material:1.11.0"\n}\n' > app/build.gradle
      - name: Write settings.gradle
        run: |
          printf 'pluginManagement {\n    repositories {\n        google()\n        mavenCentral()\n        gradlePluginPortal()\n    }\n}\ndependencyResolutionManagement {\n    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n    repositories {\n        google()\n        mavenCentral()\n    }\n}\nrootProject.name = "Texas4Win"\ninclude ":app"\n' > settings.gradle
      - name: Setup Gradle
        run: gradle wrapper --gradle-version=8.4 --distribution-type=bin
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses || true
      - run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Texas4Win-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
